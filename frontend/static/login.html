<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — UrbanWind 平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f17;
            --accent-cyan: #06b6d4;
            --accent-green: #22c55e;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #e5e9f0;
            --text-muted: #8b93a7;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(6, 182, 212, 0.16), transparent 60%),
                radial-gradient(900px 500px at 90% 110%, rgba(34, 197, 94, 0.10), transparent 60%),
                var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 36px 32px 28px;
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .brand {
            text-align: center;
            margin-bottom: 6px;
        }
        .brand .logo {
            font-size: 44px;
            line-height: 1.2;
        }
        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }
        .brand p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 2px;
        }
        .tabs {
            display: flex;
            margin: 26px 0 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 4px;
            gap: 4px;
        }
        .tab {
            flex: 1;
            padding: 9px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.35), rgba(34, 197, 94, 0.25));
            color: #fff;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.25);
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .field input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-main);
            background: rgba(0, 0, 0, 0.30);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.18);
        }
        .field input::placeholder { color: #56607a; }
        .submit-btn {
            width: 100%;
            margin-top: 6px;
            padding: 12px 0;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, #0891b2, #06b6d4);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
            letter-spacing: 1px;
        }
        .submit-btn:hover { filter: brightness(1.12); }
        .submit-btn:active { transform: translateY(1px); }
        .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
        .error-msg {
            display: none;
            margin: 12px 0 0;
            padding: 10px 12px;
            font-size: 12.5px;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.30);
            border-radius: 8px;
            word-break: break-all;
        }
        .hint {
            margin-top: 18px;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.7;
        }
        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: -3px;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand">
            <div class="logo">🌬️</div>
            <h1>UrbanWind 平台</h1>
            <p>城市风场智能建模 · CFD / AI</p>
        </div>

        <div class="tabs">
            <button class="tab active" id="tab-login" onclick="switchMode('login')">登 录</button>
            <button class="tab" id="tab-register" onclick="switchMode('register')">注 册</button>
        </div>

        <form id="auth-form" onsubmit="handleSubmit(event)">
            <div class="field" id="field-username">
                <label>用户名</label>
                <input type="text" id="username" autocomplete="username" placeholder="请输入用户名" maxlength="32" required>
            </div>
            <div class="field" id="field-password">
                <label>密码</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" maxlength="128" required>
            </div>
            <div class="field" id="field-confirm" style="display:none">
                <label>确认密码</label>
                <input type="password" id="confirm" autocomplete="new-password" placeholder="请再次输入密码" maxlength="128">
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">
                <span class="loader" id="btn-loader"></span><span id="btn-text">登 录</span>
            </button>
            <div class="error-msg" id="error-msg"></div>
        </form>

        <div class="hint">
            首次使用请联系管理员获取账号<br>
            城市风场模拟 · 单车选址 · 低空经济（建设中）
        </div>
    </div>

    <script>
        'use strict';
        let mode = 'login';

        function switchMode(m) {
            mode = m;
            document.getElementById('tab-login').classList.toggle('active', m === 'login');
            document.getElementById('tab-register').classList.toggle('active', m === 'register');
            document.getElementById('field-confirm').style.display = (m === 'register') ? '' : 'none';
            document.getElementById('btn-text').textContent = (m === 'register') ? '注 册' : '登 录';
            document.getElementById('password').autocomplete = (m === 'register') ? 'new-password' : 'current-password';
            showError('');
        }

        function showError(msg) {
            var el = document.getElementById('error-msg');
            el.textContent = msg;
            el.style.display = msg ? 'block' : 'none';
        }

        async function handleSubmit(e) {
            e.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;

            if (!username || !password) { showError('请填写用户名和密码'); return; }
            if (mode === 'register') {
                if (password !== confirm) { showError('两次输入的密码不一致'); return; }
                if (password.length < 6) { showError('密码至少 6 位'); return; }
            }

            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            document.getElementById('btn-loader').style.display = 'inline-block';
            showError('');

            try {
                if (mode === 'register') {
                    var reg = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username, password: password }),
                    });
                    if (!reg.ok) {
                        var regErr = await reg.json().catch(function() { return {}; });
                        showError(regErr.detail || '注册失败，请重试');
                        return;
                    }
                }
                // 登录（注册成功后自动登录，一步到位）
                var resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password }),
                });
                if (!resp.ok) {
                    var err = await resp.json().catch(function() { return {}; });
                    showError(err.detail || '登录失败，请重试');
                    return;
                }
                window.location.href = '/';
            } catch (err) {
                showError('无法连接服务器，请确认服务已启动');
            } finally {
                btn.disabled = false;
                document.getElementById('btn-loader').style.display = 'none';
            }
        }

        // 已登录用户直接进入主界面
        fetch('/api/auth/me').then(function(r) {
            if (r.status === 200) window.location.href = '/';
        }).catch(function() {});
    </script>
</body>
</html>
